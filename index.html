<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생성형 AI 업무 활용 및 개인정보 보호 실태·수요조사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f3f5f9;
    --card: #ffffff;
    --ink: #1a2230;
    --muted: #5b6676;
    --line: #dce1e9;
    --brand: #2350c4;
    --brand-ink: #ffffff;
    --brand-weak: #eaf0fd;
    --err: #c42b2b;
    --err-weak: #fdf0f0;
    --warn: #8a5a00;
    --warn-weak: #fff6e0;
    --warn-line: #f0dfb0;
    --line-strong: #b8c3d6;
    --err-line: #efc3c3;
    --chrome: rgba(255, 255, 255, .95);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161d; --card: #1a2029; --ink: #e6eaf1; --muted: #9aa5b5; --line: #2c3542;
      --brand: #7398f2; --brand-ink: #0d1422; --brand-weak: #1e2b48; --err: #f07a7a; --err-weak: #3a1d1d;
      --warn: #f0c46a; --warn-weak: #2c2514; --warn-line: #4d3f1c; --line-strong: #46536a; --err-line: #6b3434;
      --chrome: rgba(22, 27, 35, .95); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161d; --card: #1a2029; --ink: #e6eaf1; --muted: #9aa5b5; --line: #2c3542;
    --brand: #7398f2; --brand-ink: #0d1422; --brand-weak: #1e2b48; --err: #f07a7a; --err-weak: #3a1d1d;
    --warn: #f0c46a; --warn-weak: #2c2514; --warn-line: #4d3f1c; --line-strong: #46536a; --err-line: #6b3434;
    --chrome: rgba(22, 27, 35, .95); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--chrome); }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  button, input, textarea { font: inherit; color: inherit; }

  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: var(--chrome);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .top-in, .nav-in, .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top-in { max-width: 760px; margin: 0 auto; padding-block: 10px; display: flex; align-items: center; gap: 14px; }
  .top-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .progress { flex: 0 0 38%; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .25s; }
  .testmode { background: var(--warn-weak); color: var(--warn); font-size: 13px; text-align: center; padding: 6px 16px; border-bottom: 1px solid var(--warn-line); }

  .wrap { max-width: 760px; margin: 0 auto; padding-block: 24px 120px; }
  .page[hidden] { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
  .card + .card { margin-top: 14px; }

  h1 { font-size: 24px; line-height: 1.35; margin: 0 0 16px; letter-spacing: -0.01em; }
  h2 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .lead { margin: 0 0 18px; }
  .meta { margin: 0; padding: 14px 16px; background: var(--bg); border-radius: 10px; font-size: 15px; display: grid; gap: 4px; }
  .meta b { display: inline-block; min-width: 92px; color: var(--muted); font-weight: 500; }
  .note { font-size: 14px; color: var(--muted); margin: 14px 0 0; }
  .section-note { margin: 10px 0 0; padding: 12px 14px; background: var(--brand-weak); border-radius: 10px; font-size: 15px; }
  .notice { margin: 16px 0 0; padding: 12px 14px; background: var(--warn-weak); color: var(--warn); border-radius: 10px; font-size: 14px; }

  .q { border: 0; margin: 0; padding: 22px 0 0; }
  .q + .q { border-top: 1px solid var(--line); margin-top: 22px; }
  .q[hidden] { display: none; }
  .q-head { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; font-size: 17px; line-height: 1.5; }
  .no { flex: 0 0 auto; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 8px; background: var(--brand-weak); color: var(--brand); font-size: 14px; display: inline-flex; align-items: center; justify-content: center; margin-top: -1px; }
  .hint { margin: 4px 0 12px 38px; font-size: 14px; color: var(--muted); }
  .count { color: var(--brand); font-weight: 600; }

  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin-left: 38px; }
  .opt { display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); cursor: pointer; transition: border-color .12s, background .12s; }
  .opt:hover { border-color: var(--line-strong); }
  .opt.on { border-color: var(--brand); background: var(--brand-weak); }
  .opt.disabled { opacity: .45; cursor: not-allowed; }
  .opt input { flex: 0 0 auto; width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--brand); cursor: inherit; }
  .opt:has(input:focus-visible) { outline: 2px solid var(--brand); outline-offset: 2px; }

  .other-input, textarea {
    display: block; width: calc(100% - 38px); margin: 8px 0 0 38px;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card);
  }
  .other-input[hidden] { display: none; }
  textarea { min-height: 140px; resize: vertical; margin-top: 0; }
  .other-input:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: var(--brand); }
  .charcount { margin: 4px 0 0; text-align: right; font-size: 13px; color: var(--muted); }

  .err { margin: 8px 0 0 38px; color: var(--err); font-size: 14px; font-weight: 500; }
  .err:empty { display: none; }
  .q.invalid .opts .opt { border-color: var(--err-line); }
  .q.invalid .other-input:not([hidden]) { border-color: var(--err); }

  .nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--chrome); border-top: 1px solid var(--line); z-index: 10; }
  .nav[hidden] { display: none; }
  .nav-in { max-width: 760px; margin: 0 auto; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: center; }
  .nav-msg { flex: 1; font-size: 14px; color: var(--err); }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 11px 20px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); min-width: 120px; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn.big { width: 100%; padding: 14px; font-size: 17px; margin-top: 22px; }

  .done { text-align: center; padding: 48px 24px; }
  .done .mark { width: 56px; height: 56px; border-radius: 50%; background: var(--brand-weak); color: var(--brand); display: inline-flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 12px; }
  details { margin-top: 20px; text-align: left; font-size: 13px; }
  details pre { background: var(--bg); padding: 12px; border-radius: 8px; overflow: auto; max-height: 320px; white-space: pre-wrap; }

  @media (max-width: 560px) {
    .card { padding: 22px 16px; }
    h1 { font-size: 21px; }
    .hint, .err { margin-left: 0; }
    .opts { margin-left: 0; grid-template-columns: 1fr; }
    .other-input, textarea { width: 100%; margin-left: 0; }
    .progress { flex-basis: 42%; }
  }
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="top-in">
    <div class="top-title">생성형 AI 업무 활용 및 개인정보 보호 설문</div>
    <div class="progress"><div class="bar"><i id="bar"></i></div><span id="pct">0%</span></div>
  </div>
</header>
<div class="testmode" id="testmode" hidden>테스트 버전입니다. 제출해도 응답은 저장되지 않습니다.</div>

<main class="wrap" id="app"></main>

<nav class="nav" id="nav" hidden>
  <div class="nav-in">
    <button type="button" class="btn" id="prev">이전</button>
    <div class="nav-msg" id="navmsg" role="alert"></div>
    <button type="button" class="btn primary" id="next">다음</button>
  </div>
</nav>

<script>
const CONFIG = {
  // Google Apps Script 웹 앱 URL (배포방법.md 참고). 비워 두면 테스트 모드로 동작하며 응답이 저장되지 않습니다.
  ENDPOINT: 'https://script.google.com/macros/s/AKfycbwa7p1C0-pHLeGYRhS0zehxCLo5kBGVyKHQeEj6pRAXcM-AbeYImfDgrIAabUaEM9jC/exec',
  SURVEY_ID: 'genai-privacy-2026',
};

const OTHER = '기타';
const NO_USE = '사용하지 않음';
const NO_INPUT = '업무자료 입력 경험 없음';
const isUser = a => !!a.Q2 && a.Q2 !== NO_USE;
const isNonUser = a => a.Q2 === NO_USE;
// Q8에서 '업무자료 입력 경험 없음'을 고른 사용자는 Q9·Q10을 건너뛰고 Q11로 이동
const hasInputExp = a => isUser(a) && !(a.Q8 || []).includes(NO_INPUT);

const SECTIONS = [
  { title: 'Ⅰ. 기본 정보 및 AI 활용', questions: [
    { id: 'Q1', col: '업무 계열', type: 'single', text: '어느 업무 계열에서 일하시나요?',
      options: ['학사', '인사', '입학', '연구', '기획/평가', '예산/재무'], other: true },
    { id: 'Q2', col: 'AI 사용 빈도', type: 'single', text: '업무에 생성형 AI를 얼마나 자주 쓰시나요?',
      options: ['매일', '주 2~3회', '주 1회 이하', NO_USE] },
    { id: 'Q3', col: '미사용 이유', type: 'multi', when: isNonUser, text: '사용하지 않는 이유는 무엇인가요?',
      options: ['필요하지 않아서', '개인정보·보안이 걱정돼서', '사용법을 몰라서', '결과를 믿기 어려워서'], other: true },
    { id: 'Q4', col: '주 활용 업무', type: 'multi', when: isUser, text: '생성형 AI를 주로 어떤 업무에 활용하나요?',
      options: ['공문·보고서 작성', '이메일·민원 답변', '규정·법령 검토', '엑셀 분석·수식', '회의록·자료 요약', '학생·교직원 관련 자료 분석', '행사·홍보 기획'], other: true },
  ]},
  { title: 'Ⅱ. 업무와 개인정보', questions: [
    { id: 'Q7', col: '취급 개인정보', type: 'multi', text: '업무에서 다루는 개인정보는 무엇인가요?',
      options: ['이름', '학번·사번', '연락처', '주민등록번호·외국인등록번호', '주소', '성적·학적', '급여·계좌', '건강·상담 등 민감정보'], other: true },
    { id: 'Q8', col: 'AI 입력 경험 자료', type: 'multi', when: isUser, text: 'AI에 입력한 경험이 있는 업무자료는 무엇인가요?',
      options: ['개인정보 없는 일반 문서', '이름·학번이 포함된 자료', '연락처·주소 등이 포함된 자료', '주민등록번호 등 고유식별정보 포함 자료', '건강·평가 등 민감정보 포함 자료', NO_INPUT, '기억나지 않음'],
      exclusive: [NO_INPUT, '기억나지 않음'] },
    { id: 'Q9', col: '주 사용 자료 형식', type: 'multi', max: 3, when: hasInputExp, text: 'AI 업무에 주로 사용하는 자료 형식은 무엇인가요?',
      options: ['엑셀·CSV', '한글(HWP·HWPX)', '워드', '텍스트 PDF', '스캔 PDF', '이미지·캡처', 'PPT', '메일·그룹웨어 본문 복사', '직접 입력'], other: true },
    { id: 'Q10', col: '개인정보 자료 입력 방식', type: 'single', when: hasInputExp, text: '개인정보가 있는 자료를 AI에 입력할 때 보통 어떻게 하나요?',
      options: ['그대로 입력', '일부만 삭제·수정', '모두 가린 뒤 입력', '개인정보가 있으면 입력하지 않음', '해당 경험 없음'] },
    { id: 'Q11', col: '가림·삭제 방법', type: 'multi', text: '(가리거나 지우는 경우) 어떤 방법으로 처리하나요?',
      options: ['직접 지움', '가짜 이름·번호로 변경', '마스킹 도구 사용', '해당없음'], other: true, exclusive: ['해당없음'] },
  ]},
  { title: 'Ⅲ. 개인정보 보호 인식', questions: [
    { id: 'Q12', col: '학교 지침 인지', type: 'single', text: 'AI 사용 시 개인정보 처리에 관한 학교 지침이 있다고 알고 계신가요?',
      options: ['있고 내용도 알고 있음', '있다고 들었으나 내용은 모름', '없을 것으로 알고 있음', '모름'] },
    { id: 'Q13', col: '입력 판단 기준', type: 'single', text: 'AI에 자료를 넣어도 되는지 판단할 때 주로 무엇을 기준으로 하나요?',
      options: ['학교 지침', '개인 판단', '팀장·동료 또는 개인정보 담당자 문의', '특별한 기준 없음', 'AI를 사용하지 않아 해당 없음'] },
    { id: 'Q14', col: '개인정보보호 애로사항', type: 'multi', max: 2, text: '생성형 AI 활용 시 개인정보보호와 관련하여 가장 어렵거나 불편한 점은 무엇인가요?',
      options: ['AI에 입력 가능한 자료인지 판단하기 어려움', '개인정보를 일일이 가리는 번거로움', '개인정보 마스킹 누락 우려', '마스킹 후 문서 서식이 변경될 우려', '마스킹으로 인한 AI 답변 정확도 저하 우려', '개인정보 관련 문의·지원 창구 부족', '어려움 없음'],
      other: true, exclusive: ['어려움 없음'] },
  ]},
  { title: 'Ⅳ. PII Guard 개발 및 지원 수요',
    note: '※ PII Guard란 AI에 업무자료를 보내기 전에 개인정보를 찾아 가리는 프로그램을 의미합니다.', questions: [
    { id: 'Q15', col: '마스킹 사이트 이용 의향', type: 'single', text: 'AI 이용 전 별도의 개인정보 마스킹 사이트를 거쳐야 한다면 이용 의향은 어떠신가요?',
      options: ['매번 이용', '개인정보 포함 업무에 한해 이용', '절차가 간단하면 이용', '번거로워 이용하지 않을 듯함', '잘 모르겠음'] },
    { id: 'Q16', col: '선호 제공 방식', type: 'single', text: '가장 편리할 것으로 생각하는 제공 방식은 무엇인가요?',
      options: ['별도 웹사이트에서 마스킹 후 복사', '기존 AI 입력창에서 자동 탐지·마스킹(확장 프로그램)', '개인정보 보호 기능이 포함된 대학 전용 AI 포털', '문서를 올리면 마스킹된 파일을 내려받는 방식', '잘 모르겠음'] },
    { id: 'Q17', col: '필요 기능', type: 'multi', max: 3, text: '개인정보 마스킹 프로그램에 가장 필요한 기능은 무엇인가요?',
      options: ['이름·학번 등 개인정보 자동 탐지 및 가리기', '엑셀·PDF 파일 업로드를 통한 마스킹 처리', '원문/결과 비교 및 직접 수정', '업무 유형에 따른 기본 마스킹 설정', 'AI에 보낼 질문까지 작성', '마스킹 후 정보 복원', '외부 전송 전 위험 경고'], other: true },
    { id: 'Q18', col: '마스킹 필요 업무', type: 'multi', max: 2, text: 'PII Guard와 같은 개인정보 자동 마스킹 프로그램이 가장 필요하다고 생각하는 업무는 무엇인가요?',
      options: ['공문 및 보고서 작성', '학생·교직원 민원 답변', '성적·장학금 관련 자료 분석', '인사·급여 관련 자료 처리', '회의록 및 내부자료 요약', '규정·법령 검토'], other: true },
    { id: 'Q19', col: '허용 확인 시간', type: 'single', text: 'AI 사용 전 개인정보 확인 절차에 허용 가능한 시간은 어느 정도인가요?',
      options: ['30초 이내', '약 1분', '약 3분', '5분 이상도 가능', '업무에 따라 다름'] },
    { id: 'Q20', col: '필요 안내 형태', type: 'multi', max: 2, text: '개인정보처리 관련하여 어떤 형태의 안내가 가장 필요한가요?',
      options: ['한 장짜리 기준표', '사전 점검 체크리스트', '문답형 안내 챗봇', '짧은 교육영상', '부서별 안전 활용 사례', '개인정보 자동 마스킹 도구', '담당자 상담창구'] },
  ]},
  { title: 'Ⅴ. 기타 의견', questions: [
    { id: 'Q21', col: '도입 시 우려', type: 'single', text: 'PII Guard가 실제 업무에 도입된다면 가장 우려되는 점은 무엇인가요?',
      options: ['탐지·마스킹 누락', '사용 절차가 번거로움', '원문 유출·저장 우려', 'AI 답변 품질 저하', '파일 서식 손상', '특별한 우려 없음'], other: true },
    { id: 'Q22', col: '학교 개선·지원 의견', type: 'text', optional: true, maxLength: 2000,
      text: 'AI를 안전하게 사용하기 위해 학교가 개선하거나 지원했으면 하는 사항을 자유롭게 적어주세요.' },
  ]},
];

const ALLQ = SECTIONS.flatMap(s => s.questions);
// 화면에 보이는 문항 번호와 시트 열 이름은 순서대로 자동으로 매김 (id는 원문 문항 번호 기준으로 고정)
ALLQ.forEach((q, i) => { q.no = i + 1; });
const QMAP = Object.fromEntries(ALLQ.map(q => [q.id, q]));
const SUBMITTED_KEY = CONFIG.SURVEY_ID + ':submitted';

const answers = {};
const others = {};
let page = -1;            // -1: 안내, 0..n-1: 섹션, n: 완료
let startedAt = 0;
let responseId = '';
let submitting = false;

const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isVisible = q => !q.when || q.when(answers);
const optionsOf = q => q.other ? [...q.options, OTHER] : q.options;
const selected = q => { const v = answers[q.id]; return Array.isArray(v) ? v : (v ? [v] : []); };
const qEl = q => document.getElementById('q-' + q.id);
const visibleQs = si => SECTIONS[si].questions.filter(isVisible);

function storageGet(key) { try { return localStorage.getItem(key); } catch { return null; } }
function storageSet(key, val) { try { localStorage.setItem(key, val); } catch {} }
function newId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function hintOf(q) {
  if (q.type === 'single') return '1개 선택';
  if (q.type === 'multi') return q.max ? `최대 ${q.max}개 선택` : '복수 선택';
  return q.optional ? '선택 응답 · 자유 기술' : '';
}

function renderQuestion(q) {
  let body;
  if (q.type === 'text') {
    body = `<textarea id="in-${q.id}" data-text="${q.id}" maxlength="${q.maxLength}" aria-labelledby="h-${q.id}" placeholder="자유롭게 작성해 주세요."></textarea>
      <p class="charcount"><span data-chars="${q.id}">0</span> / ${q.maxLength}자</p>`;
  } else {
    const kind = q.type === 'single' ? 'radio' : 'checkbox';
    body = `<div class="opts">${optionsOf(q).map(o =>
      `<label class="opt"><input type="${kind}" name="${q.id}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>`;
    if (q.other) body += `<input type="text" class="other-input" data-other="${q.id}" maxlength="200" placeholder="기타 내용을 입력해 주세요" aria-label="${q.no}번 기타 내용" hidden>`;
  }
  return `<div class="q" id="q-${q.id}" data-qid="${q.id}" role="group" aria-labelledby="h-${q.id}">
    <div class="q-head" id="h-${q.id}"><span class="no">${q.no}</span><span>${esc(q.text)}</span></div>
    <p class="hint">${hintOf(q)}${q.max ? ` <span class="count" data-count="${q.id}"></span>` : ''}</p>
    ${body}
    <p class="err" data-err="${q.id}"></p>
  </div>`;
}

function render() {
  const already = storageGet(SUBMITTED_KEY);
  const intro = `<section class="page" id="page-intro">
    <div class="card">
      <h1>생성형 AI 업무 활용 및<br>개인정보 보호 실태·수요조사</h1>
      <p class="lead">안녕하세요. 2026학년도 직원 AI 학습동아리(CoP) Aegis AI 팀입니다. 저희는 대학 행정업무에서 생성형 AI를 안전하게 활용하는 방법을 연구하고 있습니다. 이번 설문으로 AI 활용 현황과 개인정보 보호 관련 어려움을 파악해, 개인정보 자동 마스킹 프로그램(PII Guard)과 안전 활용 가이드라인 개발에 반영하려고 합니다. 응답 내용은 연구 목적 외에는 사용하지 않습니다.</p>
      <div class="meta">
        <div><b>대상</b>학사·장학·인사·연구 등 개인정보 취급 행정부서 직원</div>
        <div><b>예상 소요시간</b>약 5분 (총 20문항)</div>
      </div>
      <p class="note">응답 내용에 따라 해당하지 않는 문항은 자동으로 건너뜁니다.</p>
      ${already ? `<p class="notice">이 브라우저에서 이미 응답을 제출한 기록이 있습니다. 중복 응답이 되지 않도록 유의해 주세요.</p>` : ''}
      <button type="button" class="btn primary big" id="start">설문 시작하기</button>
    </div>
  </section>`;
  const sections = SECTIONS.map((s, i) => `<section class="page" id="page-${i}" hidden>
    <div class="card">
      <h2 tabindex="-1">${esc(s.title)}</h2>
      ${s.note ? `<p class="section-note">${esc(s.note)}</p>` : ''}
      ${s.questions.map(renderQuestion).join('')}
    </div>
  </section>`).join('');
  const done = `<section class="page" id="page-done" hidden>
    <div class="card done">
      <div class="mark" aria-hidden="true">✓</div>
      <h2 tabindex="-1">응답해 주셔서 감사합니다</h2>
      <p class="lead" style="margin-top:8px">소중한 의견은 PII Guard 및 안전 활용 가이드라인 개발에 반영하겠습니다.<br>이제 창을 닫으셔도 됩니다.</p>
      <div id="debug"></div>
    </div>
  </section>`;
  $('#app').innerHTML = intro + sections + done;
  ALLQ.forEach(sync);
  $('#testmode').hidden = !!CONFIG.ENDPOINT;
}

// 화면의 입력 상태를 answers에 반영하고 선택 개수 제한·기타 입력란을 갱신
function sync(q) {
  const el = qEl(q);
  if (q.type === 'single') {
    const c = el.querySelector('input:checked');
    answers[q.id] = c ? c.value : '';
  } else if (q.type === 'multi') {
    const boxes = [...el.querySelectorAll('input[type=checkbox]')];
    answers[q.id] = boxes.filter(b => b.checked).map(b => b.value);
    if (q.max) {
      const full = answers[q.id].length >= q.max;
      boxes.forEach(b => { b.disabled = full && !b.checked; });
      el.querySelector('[data-count]').textContent = `(${answers[q.id].length}/${q.max})`;
    }
  } else {
    answers[q.id] = el.querySelector('textarea').value;
    el.querySelector('[data-chars]').textContent = answers[q.id].length;
  }
  el.querySelectorAll('.opt').forEach(o => {
    const inp = o.querySelector('input');
    o.classList.toggle('on', inp.checked);
    o.classList.toggle('disabled', inp.disabled);
  });
  if (q.other) {
    const inp = el.querySelector('.other-input');
    const on = selected(q).includes(OTHER);
    inp.hidden = !on;
    inp.disabled = !on;
  }
  if (el.classList.contains('invalid')) validate(q);
}

function errorOf(q) {
  if (q.type === 'text') return '';
  const sel = selected(q);
  if (!sel.length) return '응답을 선택해 주세요.';
  if (q.other && sel.includes(OTHER) && !(others[q.id] || '').trim()) return '기타 내용을 입력해 주세요.';
  return '';
}

function validate(q) {
  const msg = errorOf(q);
  const el = qEl(q);
  el.classList.toggle('invalid', !!msg);
  el.querySelector('[data-err]').textContent = msg;
  return !msg;
}

function nextPage(from) {
  for (let i = from + 1; i < SECTIONS.length; i++) if (visibleQs(i).length) return i;
  return -1;
}
function prevPage(from) {
  for (let i = from - 1; i >= 0; i--) if (visibleQs(i).length) return i;
  return -1;
}

function refresh() {
  ALLQ.forEach(q => { qEl(q).hidden = !isVisible(q); });
  const required = ALLQ.filter(q => isVisible(q) && !q.optional);
  const answered = required.filter(q => !errorOf(q)).length;
  const pct = page >= SECTIONS.length ? 100 : Math.round(answered / required.length * 100);
  $('#bar').style.width = pct + '%';
  $('#pct').textContent = pct + '%';
  if (page >= 0 && page < SECTIONS.length) {
    $('#next').textContent = submitting ? '제출 중…' : (nextPage(page) < 0 ? '제출하기' : '다음');
  }
}

function show(p) {
  page = p;
  $('#page-intro').hidden = p !== -1;
  SECTIONS.forEach((_, i) => { $('#page-' + i).hidden = i !== p; });
  $('#page-done').hidden = p !== SECTIONS.length;
  $('#top').hidden = p === -1;
  $('#nav').hidden = p < 0 || p >= SECTIONS.length;
  $('#navmsg').textContent = '';
  refresh();
  window.scrollTo(0, 0);
  const h = document.querySelector(`#page-${p === SECTIONS.length ? 'done' : p} h2`);
  if (h) h.focus({ preventScroll: true });
}

function goNext() {
  if (submitting) return;
  const bad = visibleQs(page).filter(q => !validate(q));
  if (bad.length) {
    $('#navmsg').textContent = `응답하지 않은 문항이 ${bad.length}개 있습니다.`;
    const el = qEl(bad[0]);
    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' });
    return;
  }
  const n = nextPage(page);
  if (n < 0) submit(); else show(n);
}

function goPrev() {
  if (submitting) return;
  show(prevPage(page));
}

const colName = q => `Q${q.no}. ${q.col}`;
const otherCol = q => `Q${q.no}. 기타 내용`;

function buildPayload() {
  const columns = ['응답ID', '소요시간(초)'];
  const row = { '응답ID': responseId, '소요시간(초)': Math.round((Date.now() - startedAt) / 1000) };
  for (const q of ALLQ) {
    const vis = isVisible(q);
    const v = answers[q.id];
    columns.push(colName(q));
    row[colName(q)] = !vis ? '' : Array.isArray(v) ? v.join(', ') : (v || '').trim();
    if (q.other) {
      columns.push(otherCol(q));
      row[otherCol(q)] = vis && selected(q).includes(OTHER) ? (others[q.id] || '').trim() : '';
    }
  }
  return { survey: CONFIG.SURVEY_ID, columns, row };
}

async function send(payload) {
  if (!CONFIG.ENDPOINT) {
    await new Promise(r => setTimeout(r, 400));
    return { ok: true, test: true };
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  try {
    // text/plain 본문으로 보내야 Apps Script가 CORS 사전 요청 없이 받습니다.
    const res = await fetch(CONFIG.ENDPOINT, { method: 'POST', body: JSON.stringify(payload), signal: ctrl.signal });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '저장 실패');
    return data;
  } finally {
    clearTimeout(timer);
  }
}

async function submit() {
  submitting = true;
  $('#next').disabled = $('#prev').disabled = true;
  refresh();
  const payload = buildPayload();
  try {
    const res = await send(payload);
    storageSet(SUBMITTED_KEY, new Date().toISOString());
    if (res.test) {
      $('#debug').innerHTML = `<details><summary>테스트 버전: 실제 배포 시 저장될 데이터 보기</summary><pre>${esc(JSON.stringify(payload.row, null, 2))}</pre></details>`;
    }
    submitting = false;
    show(SECTIONS.length);
  } catch (err) {
    submitting = false;
    $('#navmsg').textContent = '제출에 실패했습니다. 네트워크를 확인한 뒤 다시 [제출하기]를 눌러 주세요.';
    console.error(err);
  } finally {
    $('#next').disabled = $('#prev').disabled = false;
    refresh();
  }
}

render();
show(-1);

$('#app').addEventListener('click', e => {
  if (e.target.id !== 'start') return;
  startedAt = Date.now();
  responseId = newId();
  show(0);
});

$('#app').addEventListener('change', e => {
  const t = e.target;
  const el = t.closest('[data-qid]');
  if (!el || t.classList.contains('other-input')) return;
  const q = QMAP[el.dataset.qid];
  if (t.type === 'checkbox' && t.checked && q.exclusive) {
    const boxes = el.querySelectorAll('input[type=checkbox]');
    const excl = q.exclusive.includes(t.value);
    boxes.forEach(b => { if (b !== t && (excl || q.exclusive.includes(b.value))) b.checked = false; });
  }
  sync(q);
  refresh();
  if (t.value === OTHER && t.checked) el.querySelector('.other-input').focus();
});

$('#app').addEventListener('input', e => {
  const t = e.target;
  const id = t.dataset.other || t.dataset.text;
  if (!id) return;
  const q = QMAP[id];
  if (t.dataset.other) {
    others[id] = t.value;
    if (qEl(q).classList.contains('invalid')) validate(q);
  } else {
    sync(q);
  }
  refresh();
});

$('#next').addEventListener('click', goNext);
$('#prev').addEventListener('click', goPrev);

window.addEventListener('beforeunload', e => {
  if (page >= 0 && page < SECTIONS.length) { e.preventDefault(); e.returnValue = ''; }
});
</script>
</body>
</html>
